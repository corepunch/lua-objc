name: Release apps

# A tag like diskmap/1.2.3 or dnb/1.2.3 builds that app with
# scripts/release/release.sh: signed with Developer ID, notarized, stapled,
# in a DMG attached to a GitHub release named after the tag. Diskmap's App
# Store build runs separately in Xcode Cloud from the same tags.
#
# Secrets (Settings → Secrets and variables → Actions):
#   MACOS_CERTIFICATE_P12       base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD  the .p12's export password
#   NOTARY_KEY_P8               base64 of an App Store Connect API key (.p8)
#   NOTARY_KEY_ID, NOTARY_ISSUER_ID  that key's ID and its issuer
# Until they are set, the run builds an ad-hoc signed DMG and publishes it
# as a draft prerelease, so the pipeline can be checked without them.

on:
  push:
    tags:
      - "diskmap/*"
      - "dnb/*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. dnb/1.0.0 (must exist)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: macos-26
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: false

      - name: Fetch the template engine
        run: git submodule update --init --depth 1 lua/vendor/etlua

      - name: Import the signing certificate
        id: signing
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          if [ -z "$CERTIFICATE" ] || [ -z "$NOTARY_KEY_P8" ]; then
            echo "No signing secrets: building an ad-hoc signed draft."
            echo "unsigned=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "unsigned=0" >> "$GITHUB_OUTPUT"

      - name: Build, sign and notarize
        id: build
        env:
          UNSIGNED: ${{ steps.signing.outputs.unsigned }}
          NOTARY_KEY: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          dmg=$(scripts/release/release.sh "$TAG" | tail -n 1)
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.build.outputs.dmg }}
          UNSIGNED: ${{ steps.signing.outputs.unsigned }}
        run: |
          app=${TAG%%/*}
          version=${TAG#*/}
          name=$(/usr/libexec/PlistBuddy -c "Print CFBundleDisplayName" "apps/$app/Info.plist")
          flags=""
          if [ "$UNSIGNED" = 1 ]; then flags="--draft --prerelease"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" --title "$name $version" --generate-notes $flags
          fi

      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"
